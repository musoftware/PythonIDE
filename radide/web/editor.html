<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RAD IDE editor</title>
<style>
  html, body, #editor { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  .rad-bp { background: #C0392B; border-radius: 50%; margin-left: 4px; width: 12px !important; height: 12px !important; margin-top: 4px; }
  .rad-bp-line { background: rgba(192, 57, 43, 0.15); }
  .rad-cur { background: #FFD700; clip-path: polygon(0 25%, 55% 25%, 55% 0, 100% 50%, 55% 100%, 55% 75%, 0 75%); margin-left: 3px; }
  .rad-cur-line { background: rgba(255, 215, 0, 0.30); }
</style>
</head>
<body>
<div id="editor"></div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="monaco/vs/loader.js"></script>
<script src="emmet/emmet-monaco.min.js"></script>
<script src="snippets.js"></script>
<script src="vsx/vsx-contrib.js"></script><!-- VS Code themes / grammars / snippets: radide/vsx/contrib_runtime.py -->

<script>
// RAD IDE <-> Monaco bridge. Python side: radide/monaco_editor.py (object "rad").
require.config({ paths: { vs: 'monaco/vs' } });
// Web workers (perf round 7): with the relative 'monaco/vs' path Monaco's workers tried to load
// file:///monaco/vs/base/worker/workerMain.js, failed, and ran tokenising/diff/HTML/CSS/JSON services on the UI
// thread ("Could not create web worker(s)"). Give them the absolute folder.
window.MonacoEnvironment = window.MonacoEnvironment || {
  getWorkerUrl: function () {
    const base = new URL('monaco/', location.href).href;
    return 'data:text/javascript;charset=utf-8,' + encodeURIComponent(
      "self.MonacoEnvironment = { baseUrl: '" + base + "' }; importScripts('" + base + "vs/base/worker/workerMain.js');");
  }
};
require(['vs/editor/editor.main'], function () {
  new QWebChannel(qt.webChannelTransport, function (channel) {
    const rad = channel.objects.rad;
    window.radChannel = channel;          // extra objects (MonacoEditor.channel_objects, radide/editkit.py)
    const editor = monaco.editor.create(document.getElementById('editor'), {
      value: '', language: 'plaintext', automaticLayout: true, fontSize: 14,
      fontFamily: "Consolas, 'Cascadia Mono', 'Courier New', monospace",
      minimap: { enabled: true }, glyphMargin: true, folding: true, renderWhitespace: 'selection',
      unicodeHighlight: { ambiguousCharacters: false, invisibleCharacters: false },
      bracketPairColorization: { enabled: true }, smoothScrolling: true, mouseWheelZoom: true,
      contextmenu: false, quickSuggestions: { other: true, comments: false, strings: false },
      suggestOnTriggerCharacters: true, wordBasedSuggestions: 'off', tabSize: 4, insertSpaces: true,
      inlineSuggest: { enabled: true, showToolbar: 'onHover' },
    });
    window.radEditor = editor;
    let muted = false;
    window.radMute = on => { muted = !!on; };   // edits whose text Python already knows (radide/editkit.py)

    // ---------------- Python -> JS requests resolved by id
    const waiting = new Map(); let nextId = 1;
    function ask(fn) { return new Promise(res => { const id = nextId++; waiting.set(id, res); fn(id); }); }
    window.radResolve = function (id, value) { const r = waiting.get(id); if (r) { waiting.delete(id); r(value); } };

    // ---------------- providers (registered once per language; re-registered when the
    // language server announces other trigger characters)
    const DEFAULT_TRIGGERS = { html: ['.', ':', '<', '"', '=', '/'], php: ['$', '>', ':', '\\', '/', "'", '"', '.', '<'],
      css: [':', '-', '@', '.', '#', ' '], scss: [':', '-', '@', '$', '.', '#'], less: [':', '-', '@', '.', '#'],
      json: ['"', ':'], javascript: ['.', '"', "'", '/', '@', '<'], typescript: ['.', '"', "'", '/', '@', '<'] };
    const providers = new Map();          // lang -> {completion, triggers}
    const inlayEmitter = new monaco.Emitter();
    window.radRefreshInlayHints = () => inlayEmitter.fire();
    const toRange = (r, pos, w) => r ? new monaco.Range(r[0] + 1, r[1] + 1, r[2] + 1, r[3] + 1)
                                     : new monaco.Range(pos.lineNumber, w.startColumn, pos.lineNumber, w.endColumn);
    function registerCompletion(lang, triggers) {
      return monaco.languages.registerCompletionItemProvider(lang, {
        triggerCharacters: triggers,
        provideCompletionItems: async (model, pos) => {
          if (model !== editor.getModel()) return { suggestions: [] };
          const items = await ask(id => rad.jsComplete(id, pos.lineNumber - 1, pos.column - 1)) || [];
          const w = model.getWordUntilPosition(pos);
          return { incomplete: items.some(i => i.incomplete), suggestions: items.map(i => {
            let range = toRange(i.range, pos, w);
            if (!range.containsPosition(pos) && !(range.getEndPosition().equals(pos))) range = toRange(null, pos, w);
            return { label: i.label, kind: i.kind, detail: i.detail || '',
              documentation: i.documentation ? { value: i.documentation } : '', insertText: i.insertText || i.label,
              insertTextRules: i.snippet ? 4 : 0, range: range, sortText: i.sortText || undefined,
              filterText: i.filterText || undefined,
              additionalTextEdits: (i.additionalTextEdits || []).map(e => ({ range: toRange(e.range), text: e.text })) };
          }) };
        } });
    }
    function ensureProviders(lang, triggers) {
      triggers = triggers || (providers.get(lang) || {}).triggers || DEFAULT_TRIGGERS[lang] || ['.'];
      const known = providers.get(lang);
      if (known) {
        if (known.triggers.join('') === triggers.join('')) return;
        known.completion.dispose();
        known.completion = registerCompletion(lang, triggers); known.triggers = triggers;
        return;
      }
      providers.set(lang, { completion: registerCompletion(lang, triggers), triggers: triggers });
      monaco.languages.registerSignatureHelpProvider(lang, {
        signatureHelpTriggerCharacters: ['(', ','],
        provideSignatureHelp: async (model, pos) => {
          if (model !== editor.getModel()) return null;
          const tip = await ask(id => rad.jsSignature(id, pos.lineNumber - 1, pos.column - 1));
          if (!tip) return null;
          if (typeof tip === 'object') {        // language server: parameters + docs (radide/lsp.py signature_info)
            return { value: { signatures: [{ label: tip.label,
              documentation: tip.documentation ? { value: tip.documentation } : undefined,
              parameters: (tip.parameters || []).map(p => ({ label: p })) }],
              activeSignature: 0, activeParameter: tip.activeParameter || 0 }, dispose() {} };
          }
          return { value: { signatures: [{ label: tip, parameters: [] }], activeSignature: 0, activeParameter: 0 },
                   dispose() {} };
        } });
      // inlay hints (types / parameter names) from the language server (rust-analyzer ...): radide/lsp.py
      monaco.languages.registerInlayHintsProvider(lang, {
        onDidChangeInlayHints: inlayEmitter.event,
        provideInlayHints: async (model, range) => {
          if (model !== editor.getModel() || typeof rad.jsInlayHints !== 'function') return { hints: [], dispose() {} };
          const list = await ask(id => rad.jsInlayHints(id, range.startLineNumber - 1, range.endLineNumber)) || [];
          return { hints: list.map(h => ({ position: { lineNumber: h.line + 1, column: h.col + 1 }, label: h.label,
            kind: h.kind || undefined, paddingLeft: !!h.left, paddingRight: !!h.right })), dispose() {} };
        } });
      monaco.languages.registerHoverProvider(lang, {
        provideHover: async (model, pos) => {
          const w = model.getWordAtPosition(pos); if (!w) return null;
          const c = editor.getScrolledVisiblePosition(pos);
          const text = await ask(id => rad.jsHover(id, w.word, c ? c.left : 0, c ? c.top : 0,
                                                   pos.lineNumber - 1, pos.column - 1));
          return text ? { contents: [{ value: text.indexOf('\n') >= 0 ? text : '`' + text + '`' }] } : null;
        } });
    }
    window.radSetTriggers = function (lang, triggers) { if (triggers && triggers.length) ensureProviders(lang, triggers); };

    // A language server is attached: switch off Monaco's own (worker based) completion/hover/diagnostics
    // for that language so items and markers are not doubled.
    window.radSetLspActive = function (lang, on) {
      const L = monaco.languages;
      const defs = { html: L.html && L.html.htmlDefaults, css: L.css && L.css.cssDefaults,
        scss: L.css && L.css.scssDefaults, less: L.css && L.css.lessDefaults, json: L.json && L.json.jsonDefaults,
        javascript: L.typescript && L.typescript.javascriptDefaults, typescript: L.typescript && L.typescript.typescriptDefaults };
      const d = defs[lang];
      if (!d || !d.setModeConfiguration) return;
      if (!d._radOrig) d._radOrig = Object.assign({}, d.modeConfiguration);
      const cfg = Object.assign({}, d._radOrig);
      if (on) { cfg.completionItems = false; cfg.hovers = false; cfg.diagnostics = false; cfg.signatureHelp = false; }
      d.setModeConfiguration(cfg);
      if (on) monaco.editor.getModelMarkers({}).filter(m => m.owner !== 'rad' && m.owner !== 'emmet')
        .forEach(m => monaco.editor.setModelMarkers(editor.getModel(), m.owner, []));
    };

    // ---------------- Emmet (emmet-monaco-es, MIT) for html/php/css/scss/less
    const EMMET_LANGS = ['html', 'php', 'css', 'scss', 'less'];
    const emmetProviders = {};
    if (window.emmetMonaco) {
      const origReg = monaco.languages.registerCompletionItemProvider;
      monaco.languages.registerCompletionItemProvider = function (lang, prov) {
        (emmetProviders[lang] = emmetProviders[lang] || []).push(prov);
        // emmet-monaco reads Monaco's private tokenizer state, which is null until the model's background
        // tokenizer exists (right after setValue / a new model): it threw a TypeError into the console on the
        // first suggestion request - no Emmet item for that request instead
        const safe = Object.assign({}, prov, { provideCompletionItems: function () {
          try { return prov.provideCompletionItems.apply(prov, arguments); } catch (e) { return undefined; }
        } });
        return origReg.call(monaco.languages, lang, safe);
      };
      try {
        emmetMonaco.emmetHTML(monaco, ['html', 'php']);
        emmetMonaco.emmetCSS(monaco, ['css', 'scss', 'less']);
      } catch (e) { console.error('emmet: ' + e); }
      finally { monaco.languages.registerCompletionItemProvider = origReg; }
    }
    const emmetLang = editor.createContextKey('radEmmetLang', false);
    // Expand the Emmet abbreviation before the cursor; force = also inside running text.
    window.radEmmetExpand = function (force) {
      const model = editor.getModel(), pos = editor.getPosition();
      for (const p of emmetProviders[model.getLanguageId()] || []) {
        let res;
        try { res = p.provideCompletionItems(model, pos, { triggerKind: 0 }); } catch (e) { res = null; }
        const item = res && res.suggestions && res.suggestions.find(s => s.detail === 'Emmet abbreviation');
        if (!item) continue;
        const r = item.range.replace || item.range.insert || item.range;
        const before = model.getLineContent(pos.lineNumber).substring(0, r.startColumn - 1);
        if (!force && before.trim() !== '' && !/[>}]\s*$/.test(before)) return false;   // a word inside running text
        editor.pushUndoStop();
        editor.executeEdits('emmet', [{ range: new monaco.Range(r.startLineNumber, r.startColumn, r.endLineNumber, r.endColumn), text: '' }]);
        editor.setPosition({ lineNumber: r.startLineNumber, column: r.startColumn });
        editor.getContribution('snippetController2').insert(item.insertText);
        editor.pushUndoStop();
        return true;
      }
      return false;
    };
    editor.addCommand(monaco.KeyCode.Tab, () => { if (!radEmmetExpand(false)) editor.trigger('keyboard', 'tab', null); },
      'radEmmetLang && editorTextFocus && !editorReadonly && !editorHasSelection && !suggestWidgetVisible && !inSnippetMode && !hasOtherSuggestions && !inlineSuggestionVisible');
    editor.addAction({ id: 'rad.emmet.expand', label: 'Emmet: Expand Abbreviation',
      keybindings: [monaco.KeyMod.CtrlCmd | monaco.KeyMod.Shift | monaco.KeyCode.Enter],
      run: () => { if (!radEmmetExpand(true)) editor.trigger('rad', 'tab', null); } });

    // ---------------- HTML / PHP / CSS snippets (radide/web/snippets.js)
    const SN = window.RAD_SNIPPETS || {};
    Object.keys(SN).forEach(lang => {
      monaco.languages.registerCompletionItemProvider(lang, {
        provideCompletionItems: (model, pos) => {
          const w = model.getWordUntilPosition(pos);
          const range = new monaco.Range(pos.lineNumber, w.startColumn, pos.lineNumber, w.endColumn);
          return { suggestions: SN[lang].map(s => ({ label: s.prefix, kind: monaco.languages.CompletionItemKind.Snippet,
            detail: s.description + ' (snippet)', documentation: { value: '```\n' + s.body + '\n```' },
            insertText: s.body, insertTextRules: 4, range: range, sortText: '~' + s.prefix })) };
        } });
    });

    // custom languages (Ring, Fortran, ...) from the plugin's syntax settings
    window.radRegisterLanguage = function (spec) {
      if (monaco.languages.getLanguages().some(l => l.id === spec.id)) return;
      monaco.languages.register({ id: spec.id });
      const esc = s => s.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&');
      const root = [];
      if (spec.block && spec.block.length === 2) root.push([new RegExp(esc(spec.block[0])), 'comment', '@block']);
      spec.lineComments.forEach(c => root.push([new RegExp(esc(c) + '.*$'), 'comment']));
      spec.quotes.forEach(q => root.push([new RegExp(esc(q) + '[^' + esc(q) + ']*' + esc(q) + '?'), 'string']));
      root.push([/\d+(\.\d+)?/, 'number']);
      root.push([/[A-Za-z_]\w*/, { cases: { '@keywords': 'keyword', '@builtins': 'type.identifier', '@default': 'identifier' } }]);
      const tokenizer = { root: root };
      if (spec.block && spec.block.length === 2)
        tokenizer.block = [[new RegExp(esc(spec.block[1])), 'comment', '@pop'], [/./, 'comment']];
      monaco.languages.setMonarchTokensProvider(spec.id, {
        ignoreCase: spec.ignoreCase, keywords: spec.keywords, builtins: spec.builtins, tokenizer: tokenizer });
      monaco.languages.setLanguageConfiguration(spec.id, {
        comments: spec.lineComments.length ? { lineComment: spec.lineComments[0] } : {},
        brackets: [['(', ')'], ['[', ']'], ['{', '}']],
        autoClosingPairs: [{ open: '(', close: ')' }, { open: '[', close: ']' }, { open: '{', close: '}' },
                           ...spec.quotes.map(q => ({ open: q, close: q }))],
      });
    };

    // A full Monarch grammar from Python (plugin.monaco_language: assembly dialects, radide/asm_intel/monarch.py).
    // Regular expressions arrive as strings (Monarch compiles them); folding = block start/end pairs, sections,
    // label bodies and runs of 3+ comment lines.
    function radFoldRanges(lines, f) {
      const pairs = (f.pairs || []).map(p => [new RegExp(p[0], 'i'), new RegExp(p[1], 'i'), p[1]]);
      const sec = f.section ? new RegExp(f.section, 'i') : null, lab = f.label ? new RegExp(f.label) : null;
      const lc = f.lineComment || [';'];
      const strip = s => { let q = ''; for (let i = 0; i < s.length; i++) { const c = s[i];
        if (q) { if (c === q) q = ''; continue; }
        if (c === '"' || c === "'") { q = c; continue; }
        if (lc.some(p => s.startsWith(p, i))) return s.substring(0, i); } return s; };
      const m = lines.map(strip), out = [], stack = [];
      let lastSec = -1, lastLab = -1, lastCode = 0, run = -1;
      const prevCode = i => { let j = i - 1; while (j > 0 && !m[j].trim()) j--; return j; };
      const add = (s, e, kind) => { if (e > s) out.push({ start: s + 1, end: e + 1, kind: kind }); };
      const COMMENT = monaco.languages.FoldingRangeKind.Comment;
      for (let i = 0; i < m.length; i++) {
        const t = m[i];
        if (t.trim()) lastCode = i;
        let closed = false;
        for (const p of pairs) if (p[1].test(t)) {
          for (let j = stack.length - 1; j >= 0; j--) if (stack[j][0][2] === p[2]) { add(stack[j][1], i); stack.length = j; break; }
          closed = true; break;
        }
        if (!closed) for (const p of pairs) if (p[0].test(t)) { stack.push([p, i]); break; }
        if (sec && sec.test(t)) {
          if (lastSec >= 0) add(lastSec, prevCode(i));
          if (lastLab >= 0) { add(lastLab, prevCode(i)); lastLab = -1; }
          lastSec = i;
        } else if (lab && lab.test(t) && !/^\s*\./.test(t)) {
          if (lastLab >= 0) add(lastLab, prevCode(i));
          lastLab = i;
        }
        const raw = lines[i].trim(), isC = !!raw && lc.some(p => raw.startsWith(p));
        if (isC && run < 0) run = i;
        else if (!isC && run >= 0) { if (i - run >= 3) add(run, i - 1, COMMENT); run = -1; }
      }
      if (lastSec >= 0) add(lastSec, lastCode);
      if (lastLab >= 0) add(lastLab, lastCode);
      if (run >= 0 && m.length - run >= 3) add(run, m.length - 1, COMMENT);
      return out;
    }
    window.radRegisterMonarch = function (spec) {
      if (monaco.languages.getLanguages().some(l => l.id === spec.id)) return;
      monaco.languages.register({ id: spec.id, aliases: spec.aliases || [] });
      try { monaco.languages.setMonarchTokensProvider(spec.id, spec.monarch); }
      catch (e) { console.error('monarch ' + spec.id + ': ' + e); }
      const conf = Object.assign({}, spec.conf || {});
      if (typeof conf.wordPattern === 'string') conf.wordPattern = new RegExp(conf.wordPattern, 'g');
      monaco.languages.setLanguageConfiguration(spec.id, conf);
      if (spec.folding) monaco.languages.registerFoldingRangeProvider(spec.id, {
        provideFoldingRanges: model => radFoldRanges(model.getLinesContent(), spec.folding) });
      if (spec.triggers) ensureProviders(spec.id, spec.triggers);
    };

    // ---------------- AI (docs/CONTRACTS.md 9.4, Python side: radide/features/ai_editor.py)
    // Inline completions (ghost text): debounced, Tab accepts, Esc dismisses (Monaco's own keys).
    const inline = { on: false, delay: 450 };
    window.radSetInline = (on, delay) => { inline.on = !!on; if (delay) inline.delay = delay;
      if (!inline.on) editor.trigger('rad', 'editor.action.inlineSuggest.hide', {}); };
    monaco.languages.registerInlineCompletionsProvider('*', {
      provideInlineCompletions: async (model, pos, ctx, token) => {
        const explicit = ctx && ctx.triggerKind === 1;
        if (!inline.on && !explicit || model !== editor.getModel() || editor.getOption(monaco.editor.EditorOption.readOnly))
          return { items: [] };
        if (!explicit) {
          const after = model.getLineContent(pos.lineNumber).substring(pos.column - 1);
          if (/^\s*[\w$]/.test(after)) return { items: [] };       // in the middle of a word / statement
          await new Promise(r => setTimeout(r, inline.delay));
          if (token.isCancellationRequested) return { items: [] };
        }
        const id = nextId++;
        const res = new Promise(r => waiting.set(id, r));
        const sub = token.onCancellationRequested(() => { rad.jsInlineCancel(id); radResolve(id, null); });
        rad.jsInlineComplete(id, pos.lineNumber - 1, pos.column - 1, !!explicit);
        const text = await res;
        sub.dispose();
        if (!text || token.isCancellationRequested) return { items: [] };
        return { items: [{ insertText: text, range: new monaco.Range(pos.lineNumber, pos.column, pos.lineNumber, pos.column) }] };
      },
      freeInlineCompletions() {},
      disposeInlineCompletions() {},
    });
    editor.addAction({ id: 'rad.ai.inlineSuggest', label: 'AI: Suggest Inline Completion',
      keybindings: [monaco.KeyMod.Alt | monaco.KeyCode.Backslash],
      run: ed => ed.trigger('rad', 'editor.action.inlineSuggest.trigger', {}) });
    // Ctrl+I: inline edit (the prompt box is a Qt widget placed at the selection)
    editor.addAction({ id: 'rad.ai.inlineEdit', label: 'AI: Edit Selection with AI...',
      keybindings: [monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyI],
      run: ed => { const s = ed.getSelection(); const p = s ? s.getStartPosition() : ed.getPosition();
        const c = ed.getScrolledVisiblePosition(p) || { left: 0, top: 0, height: 18 };
        rad.jsInlineEdit(Math.round(c.left), Math.round(c.top), Math.round(c.height || 18)); } });
    window.radCaretPoint = () => { const c = editor.getScrolledVisiblePosition(editor.getPosition());
      return c ? [Math.round(c.left), Math.round(c.top), Math.round(c.height)] : [0, 0, 18]; };
    window.radInlineSuggest = () => { editor.focus(); editor.trigger('rad', 'editor.action.inlineSuggest.trigger', {}); };
    window.radInlineAccept = () => editor.trigger('rad', 'editor.action.inlineSuggest.commit', {});

    // ---------------- events to Python
    // Text sync: small models send the whole text; big ones (> 200k chars) send only the single change
    // (perf round 7: a 2 MB text per keystroke cost ~100 ms). Python checks the length and asks for the
    // whole text (radSendFullText) when the delta cannot be applied safely.
    editor.onDidChangeModelContent((ev) => {
      if (muted) return;
      const model = editor.getModel();
      if (model.getValueLength() < 200000 || typeof rad.jsTextDelta !== 'function' || ev.changes.length !== 1) {
        rad.jsTextChanged(editor.getValue());
        return;
      }
      const c = ev.changes[0];
      rad.jsTextDelta(JSON.stringify({ len: model.getValueLength(), off: c.rangeOffset, del: c.rangeLength,
                                       text: c.text }));
    });
    window.radSendFullText = () => rad.jsTextChanged(editor.getValue());
    editor.onDidChangeCursorPosition(e => rad.jsCursor(e.position.lineNumber - 1, e.position.column - 1));
    editor.onDidChangeCursorSelection(e => { const s = e.selection;
      rad.jsSelection(s.startLineNumber - 1, s.startColumn - 1, s.endLineNumber - 1, s.endColumn - 1); });
    editor.onMouseDown(e => {
      if (e.target.type === monaco.editor.MouseTargetType.GUTTER_GLYPH_MARGIN ||
          e.target.type === monaco.editor.MouseTargetType.GUTTER_LINE_NUMBERS && e.event.leftButton && e.event.altKey)
        rad.jsToggleBreakpoint(e.target.position.lineNumber - 1);
    });
    editor.onContextMenu(e => {
      const p = e.target.position;
      rad.jsContextMenu(p ? p.lineNumber - 1 : 0, e.event.posx, e.event.posy);
    });
    editor.addAction({ id: 'rad.definition', label: 'Go to Definition', keybindings: [monaco.KeyCode.F12],
      run: ed => { const p = ed.getPosition(); rad.jsDefinition(p.lineNumber - 1, p.column - 1); } });

    // ---------------- Python -> JS commands
    let bpDecos = [], curDeco = [];
    window.radSetBreakpoints = function (lines) {
      bpDecos = editor.deltaDecorations(bpDecos, lines.map(l => ({ range: new monaco.Range(l + 1, 1, l + 1, 1),
        options: { isWholeLine: true, glyphMarginClassName: 'rad-bp', className: 'rad-bp-line' } })));
    };
    window.radSetCurrentLine = function (line) {
      curDeco = editor.deltaDecorations(curDeco, line < 0 ? [] : [{ range: new monaco.Range(line + 1, 1, line + 1, 1),
        options: { isWholeLine: true, glyphMarginClassName: 'rad-cur', className: 'rad-cur-line' } }]);
      if (line >= 0) editor.revealLineInCenter(line + 1);
    };
    window.radSetText = function (text, lang) {
      muted = true;
      window.radSetLanguage(lang);
      editor.setValue(text);
      editor.getModel().setEOL(monaco.editor.EndOfLineSequence.LF);   // the Python mirror uses \n
      muted = false;
    };
    window.radSetLanguage = function (lang) {
      lang = lang || 'plaintext';
      ensureProviders(lang);
      monaco.editor.setModelLanguage(editor.getModel(), lang);
      emmetLang.set(EMMET_LANGS.indexOf(lang) >= 0 && !!emmetProviders[lang]);
    };
    window.radLanguages = () => monaco.languages.getLanguages().map(l => l.id);
    window.radSetReadOnly = ro => editor.updateOptions({ readOnly: ro });
    window.radSetCursor = (l, c) => { editor.setPosition({ lineNumber: l + 1, column: c + 1 }); };
    window.radSetSelection = (l1, c1, l2, c2) => editor.setSelection(new monaco.Range(l1 + 1, c1 + 1, l2 + 1, c2 + 1));
    window.radReplace = (l1, c1, l2, c2, text) => {
      muted = true;
      editor.executeEdits('rad', [{ range: new monaco.Range(l1 + 1, c1 + 1, l2 + 1, c2 + 1), text: text, forceMoveMarkers: true }]);
      muted = false;
    };
    window.radReveal = l => editor.revealLineInCenter(l + 1);
    window.radSetMarkers = list => monaco.editor.setModelMarkers(editor.getModel(), 'rad', list.map(d => ({
      startLineNumber: d.line + 1, startColumn: (d.col || 0) + 1, endLineNumber: (d.endLine ?? d.line) + 1,
      endColumn: (d.endCol ?? 1000) + 1, message: d.message,
      severity: d.severity === 'error' ? 8 : d.severity === 'warning' ? 4 : 2 })));
    window.radSetTheme = t => {
      const name = (t === true) ? 'vs-dark' : (t === false || !t) ? 'vs' : String(t);
      monaco.editor.setTheme(name);
      document.body.style.background = name === 'vs' ? '#ffffff' : name === 'hc-black' ? '#000000' : '#1e1e1e';
    };
    window.radSetFont = (family, size) => editor.updateOptions({ fontFamily: family, fontSize: size });
    rad.jsReady();
  });
});
</script>
</body>
</html>
