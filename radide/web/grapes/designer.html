<!DOCTYPE html>
<!-- RAD IDE Design View (Expression Web style) built on GrapesJS - see LICENSE-grapesjs.txt -->
<html>
<head>
<meta charset="utf-8">
<title>RAD IDE Design View</title>
<link rel="stylesheet" href="grapes.min.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 12px "Segoe UI", sans-serif; background: #444; }
  #wrap { display: flex; height: 100%; }
  #gjs { flex: 1 1 auto; min-width: 0; height: 100%; }
  #side { flex: 0 0 290px; display: flex; flex-direction: column; background: #3b3b3b; color: #ddd;
          border-left: 1px solid #222; min-width: 0; }
  #side.hidden { display: none; }
  #tabs { display: flex; flex: 0 0 auto; border-bottom: 1px solid #222; }
  #tabs button { flex: 1; background: #333; color: #ccc; border: 0; border-right: 1px solid #222; padding: 7px 2px;
                 cursor: pointer; font: 12px "Segoe UI", sans-serif; }
  #tabs button.on { background: #4a4a4a; color: #fff; box-shadow: inset 0 -2px 0 #3d8bfd; }
  .pane { flex: 1 1 auto; overflow: auto; display: none; }
  .pane.on { display: block; }
  #sel-info { padding: 6px 8px; color: #9cf; border-bottom: 1px solid #222; min-height: 14px; white-space: nowrap;
              overflow: hidden; text-overflow: ellipsis; }
  .gjs-one-bg { background-color: #3b3b3b; }
  .gjs-cv-canvas { width: 100%; height: 100%; top: 0; }
  .rad-empty { padding: 10px; color: #999; }
</style>
</head>
<body>
<div id="wrap">
  <div id="gjs"></div>
  <div id="side">
    <div id="tabs">
      <button data-pane="blocks" class="on" title="Toolbox: drag blocks onto the page">Toolbox</button>
      <button data-pane="layers" title="Document outline (Layers)">Layers</button>
      <button data-pane="styles" title="CSS Properties of the selected element / rule">CSS</button>
      <button data-pane="traits" title="Tag properties (attributes)">Attributes</button>
    </div>
    <div id="sel-info"></div>
    <div id="pane-blocks" class="pane on"></div>
    <div id="pane-layers" class="pane"></div>
    <div id="pane-styles" class="pane"><div id="selectors"></div><div id="styles"></div></div>
    <div id="pane-traits" class="pane"><div id="traits"></div></div>
  </div>
</div>
<script src="grapes.min.js"></script>
<script src="grapesjs-blocks-basic.min.js"></script>
<script src="grapesjs-plugin-forms.min.js"></script>
<script src="grapesjs-parser-postcss.min.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="rad-blocks.js"></script>
<script src="designer.js"></script>
</body>
</html>
