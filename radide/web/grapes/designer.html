<!DOCTYPE html>
<!-- RAD IDE Design View (Expression Web style) built on GrapesJS - see LICENSE-grapesjs.txt -->
<html>
<head>
<meta charset="utf-8">
<title>RAD IDE Design View</title>
<link rel="stylesheet" href="grapes.min.css">
<style>
  /* colours: defaults = dark; design.py radTheme() replaces them with the IDE theme (radide/theme.py) */
  :root { --rad-panel: #3b3b3b; --rad-base: #2f2f2f; --rad-text: #ddd; --rad-muted: #aaa; --rad-border: #222;
          --rad-header: #333; --rad-header-text: #ccc; --rad-accent: #3d8bfd; --rad-link: #9cf;
          --rad-stage: #444; --rad-side-width: 280px; }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 12px "Segoe UI", sans-serif; background: var(--rad-stage); }
  #wrap { display: flex; height: 100%; }
  #gjs { flex: 1 1 auto; min-width: 0; height: 100%; }
  /* the panel has a fixed width: the canvas gets the rest (it was squeezed to ~130 px in a narrow tab) */
  #side { flex: 0 0 var(--rad-side-width); width: var(--rad-side-width); display: flex; flex-direction: column;
          background: var(--rad-panel); color: var(--rad-text); min-width: 0; }
  #side.hidden { display: none; }
  #side-toggle { flex: 0 0 12px; display: flex; align-items: center; justify-content: center; cursor: pointer;
                 background: var(--rad-header); color: var(--rad-header-text); border-left: 1px solid var(--rad-border);
                 border-right: 1px solid var(--rad-border); font: 11px "Segoe UI", sans-serif; user-select: none; }
  #side-toggle:hover { background: var(--rad-accent); color: #fff; }
  #tabs { display: flex; flex: 0 0 auto; border-bottom: 1px solid var(--rad-border); }
  #tabs button { flex: 1; background: var(--rad-header); color: var(--rad-header-text); border: 0;
                 border-right: 1px solid var(--rad-border); padding: 7px 2px; cursor: pointer; font: 12px "Segoe UI", sans-serif; }
  #tabs button.on { background: var(--rad-panel); color: var(--rad-text); box-shadow: inset 0 -2px 0 var(--rad-accent); }
  .pane { flex: 1 1 auto; overflow: auto; display: none; }
  .pane.on { display: block; }
  #sel-info { padding: 6px 8px; color: var(--rad-link); border-bottom: 1px solid var(--rad-border); min-height: 14px;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gjs-one-bg { background-color: var(--rad-panel); }
  .gjs-cv-canvas { width: 100%; height: 100%; top: 0; background: var(--rad-stage); }
  .gjs-block { background: var(--rad-base); color: var(--rad-text); border-color: var(--rad-border); width: 44%; }
  .gjs-block:hover { color: var(--rad-accent); }
  .gjs-block-category .gjs-title, .gjs-sm-sector-title, .gjs-trait-category .gjs-title, .gjs-layer-item {
    color: var(--rad-text); }
  .rad-empty { padding: 10px; color: var(--rad-muted); }
</style>
<style id="rad-theme"></style>
</head>
<body>
<div id="wrap">
  <div id="gjs"></div>
  <div id="side-toggle" title="Hide / show the Toolbox, Layers, CSS and Attributes panel">&#9656;</div>
  <div id="side">
    <div id="tabs">
      <button data-pane="blocks" class="on" title="Toolbox: drag blocks onto the page">Toolbox</button>
      <button data-pane="layers" title="Document outline (Layers)">Layers</button>
      <button data-pane="styles" title="CSS Properties of the selected element / rule">CSS</button>
      <button data-pane="traits" title="Tag properties (attributes)">Attributes</button>
    </div>
    <div id="sel-info"></div>
    <div id="pane-blocks" class="pane on"></div>
    <div id="pane-layers" class="pane"></div>
    <div id="pane-styles" class="pane"><div id="selectors"></div><div id="styles"></div></div>
    <div id="pane-traits" class="pane"><div id="traits"></div></div>
  </div>
</div>
<script src="grapes.min.js"></script>
<script src="grapesjs-blocks-basic.min.js"></script>
<script src="grapesjs-plugin-forms.min.js"></script>
<script src="grapesjs-parser-postcss.min.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="rad-blocks.js"></script>
<script src="designer.js"></script>
</body>
</html>
