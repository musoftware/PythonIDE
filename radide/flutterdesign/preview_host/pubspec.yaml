name: rad_preview_host
description: RAD IDE Flutter designer preview host - renders a *.fscreen.json widget tree with real widgets.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ">=6.2.0 <9.0.0"
  http: ^1.2.0
  lottie: ^3.3.2
  web: ">=1.0.0 <2.0.0"

flutter:
  uses-material-design: true
