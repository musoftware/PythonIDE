<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{APP_NAME}}</title>
    <meta name="description" content="{{APP_NAME}} - an Express web site">
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>
<header><h1>{{APP_NAME}}</h1><p>Express + a JSON API. Server time: <span id="time">...</span></p></header>

    <form id="note-form">
        <input id="note-text" maxlength="500" placeholder="Write a note" required aria-label="Note">
        <button type="submit">Add</button>
    </form>
    <ul id="notes"></ul>
</main>
<script src="/js/app.js"></script>
</body>
</html>
