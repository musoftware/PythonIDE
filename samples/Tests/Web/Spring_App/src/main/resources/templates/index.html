<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('SpringMvc1')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
	<p>Welcome to <strong th:text="${title}">SpringMvc1</strong> - a Spring Boot app made with RAD IDE.</p>
	<p>Server time: <span id="time">...</span></p>
</main>
<script>fetch('/api/time').then(r => r.json()).then(d => document.getElementById('time').textContent = d.time);</script>
</body>
</html>
