{% extends "base.html" %}

{% block title %}Edit - {{ super() }}{% endblock %}

{% block content %}
<h2>Edit todo #{{ todo.id }}</h2>
<form method="post">
    <input name="title" value="{{ todo.title }}"> <button>Save</button>
    <a href="{{ url_for('todos.index') }}">Cancel</a>
</form>
{% endblock %}
