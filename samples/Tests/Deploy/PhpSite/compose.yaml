# generated by RAD IDE (Docker > Generate Dockerfile). `docker compose up --build` runs the app.
name: "phpsite"
services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DATABASE_URL: "mysql://app:change-me@db:3306/app"
    depends_on:
      - db
    develop:
      watch:
        - action: sync
          path: .
          target: /var/www/html
          ignore:
            - "vendor/"
    restart: unless-stopped
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: "app"
      MARIADB_USER: "app"
      MARIADB_PASSWORD: "change-me"
      MARIADB_ROOT_PASSWORD: "change-me-root"
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped
volumes:
  db-data: {}
