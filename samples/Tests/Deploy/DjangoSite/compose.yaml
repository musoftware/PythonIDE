# generated by RAD IDE (Docker > Generate Dockerfile). `docker compose up --build` runs the app.
name: "djangosite"
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://app:change-me@db:5432/app"
      DJANGO_DEBUG: "0"
    depends_on:
      - db
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - "__pycache__/"
            - ".venv/"
        - action: rebuild
          path: requirements.txt
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "app"
      POSTGRES_PASSWORD: "change-me"
      POSTGRES_DB: "app"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  db-data: {}
