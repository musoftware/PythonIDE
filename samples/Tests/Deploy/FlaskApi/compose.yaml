# generated by RAD IDE (Docker > Generate Dockerfile). `docker compose up --build` runs the app.
name: "flaskapi"
services:
  web:
    build: .
    ports:
      - "8000:8000"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - "__pycache__/"
            - ".venv/"
        - action: rebuild
          path: requirements.txt
    restart: unless-stopped
