# generated by RAD IDE (Docker > Generate Dockerfile). `docker compose up --build` runs the app.
name: "expressapi"
services:
  web:
    build: .
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - "node_modules/"
        - action: rebuild
          path: package.json
    restart: unless-stopped
