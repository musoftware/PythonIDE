<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} - FastApiTasks</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/site.css') }}">
</head>
<body>
<header><h1>Tasks</h1><nav><a href="/docs">API docs</a></nav></header>
<main>
    <form id="add">
        <input id="title" placeholder="What needs to be done?" maxlength="120" required>
        <select id="priority"><option value="high">High</option><option value="normal" selected>Normal</option>
            <option value="low">Low</option></select>
        <button>Add</button>
    </form>
    <p id="stats"></p>
    <label><input type="checkbox" id="hideDone"> Hide finished tasks</label>
    <ul id="list"></ul>
</main>
<script src="{{ url_for('static', path='js/tasks.js') }}"></script>
</body>
</html>
