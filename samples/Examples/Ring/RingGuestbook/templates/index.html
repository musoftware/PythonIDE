<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ring Guestbook</title>
<style>
  body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; margin: 0; background: #f3f5fa; color: #1d2433; }
  main { max-width: 680px; margin: 32px auto; padding: 0 16px; }
  h1 { margin-bottom: 4px; }
  form { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 2px 10px #0001; display: grid; gap: 8px; }
  input, textarea { font: inherit; padding: 8px; border: 1px solid #c9d0e0; border-radius: 6px; }
  button { justify-self: start; padding: 8px 18px; border: 0; border-radius: 6px; background: #3b5bdb; color: #fff; font: inherit; }
  ul { list-style: none; padding: 0; }
  li { background: #fff; margin: 8px 0; padding: 10px 14px; border-radius: 8px; unicode-bidi: plaintext; }
  li small { color: #6b7385; }
  .error { color: #c92a2a; font-weight: 600; }
  .empty { color: #6b7385; }
</style>
</head>
<body>
<main>
  <h1>Ring Guestbook</h1>
  <p>Served by Ring (RingHTTPLib) with SQLite - {count} entries. JSON: <a href="/api/entries">/api/entries</a> - <a href="/about">About</a></p>
  {error}
  <form method="post" action="/sign">
    <input name="name" placeholder="Your name / اسمك" maxlength="60" required>
    <textarea name="message" rows="3" placeholder="Your message / رسالتك" maxlength="500" required></textarea>
    <button>Sign the guestbook</button>
  </form>
  <ul id="entries">
{entries}
  </ul>
</main>
</body>
</html>
