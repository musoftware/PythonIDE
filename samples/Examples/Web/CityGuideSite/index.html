<header>
    <h1>City Guide</h1>

<main>
    <h2>Places to visit</h2>
    <div class="toolbar">
        <input id="filter" type="search" placeholder="Filter places..." aria-label="Filter places">

        (localStorage), so they are still there after a reload.</p>
